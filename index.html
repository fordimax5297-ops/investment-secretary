<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>股市投資秘書</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <div class="eyebrow">AI Swing Trading</div>
      <h1>股市投資秘書</h1>
    </div>
    <button id="refreshBtn" class="icon-btn" aria-label="重新整理">↻</button>
  </header>

  <main>
    <section class="hero-card">
      <div>
        <div class="label">資料基準日</div>
        <div id="tradeDate" class="hero-value">—</div>
      </div>
      <div class="hero-right">
        <div class="label">目前模式</div>
        <div id="topCount" class="hero-value">波段 5</div>
      </div>
    </section>

    <section class="strategy-tabs" aria-label="選股週期">
      <button id="swingTab" class="strategy-tab active" type="button">
        <span>波段 Top 5</span>
        <small>30–45D</small>
      </button>
      <button id="shortTab" class="strategy-tab" type="button">
        <span>短線 Top 5</span>
        <small>10–20D</small>
      </button>
    </section>

    <section id="swingSection">
      <section class="section-head">
        <div>
          <h2>今日波段 Top 5</h2>
          <p>30D / 45D 歷史經驗勝率；Current Setup 優先。</p>
        </div>
      </section>
      <div id="top5List" class="cards"></div>
      <div class="method-note">依個股歷史走勢統計，非相同訊號回測結果。</div>
    </section>

    <section id="shortSection" class="hidden">
      <section class="section-head">
        <div>
          <h2>今日短線 Top 5</h2>
          <p>10D / 20D 歷史經驗勝率；動能、籌碼與量價優先。</p>
        </div>
      </section>
      <div id="shortTop5List" class="cards"></div>
      <div class="method-note">依個股歷史走勢統計，非相同訊號回測結果。</div>
    </section>

    <section class="section-head">
      <div>
        <h2>系統狀態</h2>
        <p>API / FinalSwing / Performance / Archive</p>
      </div>
    </section>

    <div id="healthGrid" class="health-grid"></div>

    <section class="section-head">
      <div>
        <h2>最近績效</h2>
        <p>5D / 10D / 20D / 30D / 45D 將隨交易日累積。</p>
      </div>
    </section>

    <div id="performanceList" class="performance-list"></div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-view="top5">Top5</button>
    <button class="nav-item" data-view="performance">績效</button>
    <button class="nav-item" data-view="system">系統</button>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
